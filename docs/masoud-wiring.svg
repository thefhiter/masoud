    <text x="944" y="434">G</text>
    <text x="944" y="464">R</text>
    <text x="1116" y="389" text-anchor="end">L+</text>
    <text x="1116" y="419" text-anchor="end">L−</text>
    <text x="1116" y="479" text-anchor="end">R+</text>
    <text x="1116" y="509" text-anchor="end">R−</text>
    <text x="965" y="536" text-anchor="middle">GND</text>
    <text x="1005" y="536" text-anchor="middle">+5V</text>
  </g>
  <text x="944" y="418" fill="#C8E6C9" font-size="10">input</text>
  <text x="1116" y="443" fill="#C8E6C9" font-size="10" text-anchor="end">speakers</text>

  <!-- ===================== SPEAKERS ===================== -->
  <g>
    <circle cx="1226" cy="280" r="46" fill="#3A3F47"/><circle cx="1226" cy="280" r="32" fill="#596170"/><circle cx="1226" cy="280" r="10" fill="#2A2E35"/>
    <rect x="1166" y="262" width="14" height="12" rx="2" fill="#D4AF37"/><rect x="1166" y="286" width="14" height="12" rx="2" fill="#D4AF37"/>
    <text x="1226" y="218" fill="#1F2937" font-size="13" font-weight="700" text-anchor="middle" font-family="Rubik, Segoe UI, sans-serif">Speaker 1</text>
    <text x="1173" y="256" fill="#1F2937" font-size="14" font-weight="700" text-anchor="middle">+</text>
    <text x="1173" y="314" fill="#1F2937" font-size="14" font-weight="700" text-anchor="middle">−</text>
  </g>
  <g>
    <circle cx="1226" cy="620" r="46" fill="#3A3F47"/><circle cx="1226" cy="620" r="32" fill="#596170"/><circle cx="1226" cy="620" r="10" fill="#2A2E35"/>
    <rect x="1166" y="602" width="14" height="12" rx="2" fill="#D4AF37"/><rect x="1166" y="626" width="14" height="12" rx="2" fill="#D4AF37"/>
    <text x="1226" y="690" fill="#1F2937" font-size="13" font-weight="700" text-anchor="middle" font-family="Rubik, Segoe UI, sans-serif">Speaker 2</text>
    <text x="1173" y="596" fill="#1F2937" font-size="14" font-weight="700" text-anchor="middle">+</text>
    <text x="1173" y="654" fill="#1F2937" font-size="14" font-weight="700" text-anchor="middle">−</text>
  </g>

  <!-- ===================== WIRES (white halo, then color) ===================== -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M380 166V196H318V690H510V580"/>
    <path d="M414 166V280H500V320"/>
    <path d="M516 166V230H520V320"/>
    <path d="M482 166V262H560V320"/>
    <path d="M550 166V244H580V320"/>
    <path d="M618 166V262H600V320"/>
    <path d="M652 166V280H620V320"/>
    <path d="M736 320V292H880V460H930"/><path d="M880 400H930"/>
    <path d="M530 580V745H1005V550"/>
    <path d="M570 580V725H965V550"/>
    <path d="M1130 385H1148V268H1166"/><path d="M1130 415H1158V292H1166"/>
