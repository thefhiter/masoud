    <text transform="translate(494 562) rotate(-90)" fill="#BFE3E6">RESET</text>
    <text transform="translate(514 562) rotate(-90)" font-weight="700">3.3V</text>
    <text transform="translate(534 562) rotate(-90)" font-weight="700">5V</text>
    <text transform="translate(554 562) rotate(-90)" fill="#BFE3E6">GND</text>
    <text transform="translate(574 562) rotate(-90)" font-weight="700">GND</text>
    <text transform="translate(594 562) rotate(-90)" fill="#BFE3E6">VIN</text>
    <text transform="translate(654 562) rotate(-90)" fill="#BFE3E6">A0</text>
    <text transform="translate(674 562) rotate(-90)" fill="#BFE3E6">A1</text>
    <text transform="translate(694 562) rotate(-90)" fill="#BFE3E6">A2</text>
    <text transform="translate(714 562) rotate(-90)" fill="#BFE3E6">A3</text>
    <text transform="translate(734 562) rotate(-90)" fill="#BFE3E6">A4</text>
    <text transform="translate(754 562) rotate(-90)" fill="#BFE3E6">A5</text>
  </g>
  <text x="470" y="506" fill="#BFE3E6" font-size="11">POWER</text>
  <text x="650" y="506" fill="#BFE3E6" font-size="11">ANALOG IN</text>

  <!-- ===================== AMP (PAM8403) ===================== -->
  <rect x="930" y="350" width="200" height="200" rx="10" fill="#2E7D32"/>
  <text x="1030" y="374" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" font-family="Rubik, Segoe UI, sans-serif">AMP · PAM8403</text>
  <rect x="1000" y="440" width="60" height="34" rx="3" fill="#1E2227"/>
  <text x="1030" y="461" fill="#B8BEC6" font-size="10" text-anchor="middle">PAM8403</text>
  <g fill="#D4AF37">
    <rect x="924" y="394" width="12" height="12" rx="2"/><rect x="924" y="424" width="12" height="12" rx="2"/><rect x="924" y="454" width="12" height="12" rx="2"/>
    <rect x="1124" y="379" width="12" height="12" rx="2"/><rect x="1124" y="409" width="12" height="12" rx="2"/>
    <rect x="1124" y="469" width="12" height="12" rx="2"/><rect x="1124" y="499" width="12" height="12" rx="2"/>
    <rect x="959" y="544" width="12" height="12" rx="2"/><rect x="999" y="544" width="12" height="12" rx="2"/>
  </g>
  <g fill="#FFFFFF" font-size="12" font-weight="700">
