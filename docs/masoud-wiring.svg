  <!-- ===================== CALLOUTS ===================== -->
  <g font-size="12" font-weight="700">
    <rect x="96" y="380" width="200" height="54" rx="8" fill="#FDECEA" stroke="#E53935"/>
    <text x="196" y="402" fill="#B71C1C" text-anchor="middle">Screen VCC → 3.3V</text>
    <text x="196" y="420" fill="#B71C1C" text-anchor="middle">never 5V</text>
    <path d="M296 407H318" stroke="#E53935" stroke-width="2"/>

    <rect x="752" y="760" width="200" height="30" rx="8" fill="#FCE4EC" stroke="#D81B60"/>
    <text x="852" y="780" fill="#880E4F" text-anchor="middle">Amp +5V ← Uno 5V</text>

    <rect x="760" y="240" width="150" height="40" rx="8" fill="#F3E5F5" stroke="#8E24AA"/>
    <text x="835" y="256" fill="#4A148C" text-anchor="middle">D3 → amp L and R</text>
    <text x="835" y="272" fill="#4A148C" text-anchor="middle" font-weight="400">same sound on both</text>

    <rect x="1000" y="160" width="170" height="40" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
    <text x="1085" y="176" fill="#5D4037" text-anchor="middle">L− and R− are</text>
    <text x="1085" y="192" fill="#5D4037" text-anchor="middle">NOT ground</text>

    <text x="958" y="434" fill="#C8E6C9" font-size="10" font-weight="400">(leave empty)</text>
  </g>
  <g font-size="11" fill="#55606F">
    <text x="40" y="770">Wire colors here are only to tell the wires apart. Use any color you have.</text>
  </g>
</svg>
