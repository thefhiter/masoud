<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 800" role="img" aria-label="Masoud wiring: the screen's 7 wires go to Arduino pins 3.3V, GND, D13, D11, D10, D9 and D8; the amp takes D3 on its L and R inputs plus 5V and GND; speaker 1 goes on the amp's L+ and L- outputs and speaker 2 on R+ and R-." font-family="ui-monospace, Cascadia Mono, Consolas, monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#E6E8E3" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1290" height="800" fill="#FBFBF9"/>
  <rect width="1290" height="800" fill="url(#grid)"/>

  <!-- ===================== SCREEN (Waveshare 1.8" LCD) ===================== -->
  <rect x="330" y="20" width="400" height="152" rx="12" fill="#1C4F9C"/>
  <text x="350" y="44" fill="#FFFFFF" font-size="14" font-weight="700" font-family="Rubik, Segoe UI, sans-serif">SCREEN · Waveshare 1.8" LCD</text>
  <rect x="352" y="52" width="100" height="46" rx="5" fill="#05070C"/>
  <rect x="374" y="62" width="18" height="26" rx="6" fill="#00D7FF"/>
  <rect x="412" y="62" width="18" height="26" rx="6" fill="#00D7FF"/>
  <rect x="368" y="150" width="336" height="22" rx="3" fill="#0B1B33"/>
  <g fill="#FFFFFF" font-size="11">
    <text transform="translate(384 146) rotate(-90)">VCC</text>
    <text transform="translate(418 146) rotate(-90)">GND</text>
    <text transform="translate(452 146) rotate(-90)" fill="#9DB3D6">MISO</text>
    <text transform="translate(486 146) rotate(-90)">MOSI</text>
    <text transform="translate(520 146) rotate(-90)">SCK</text>
    <text transform="translate(554 146) rotate(-90)">LCD_CS</text>
    <text transform="translate(588 146) rotate(-90)" fill="#9DB3D6">RAM_CS</text>
    <text transform="translate(622 146) rotate(-90)">DC</text>
    <text transform="translate(656 146) rotate(-90)">RST</text>
    <text transform="translate(690 146) rotate(-90)" fill="#9DB3D6">BL</text>
  </g>
  <g fill="#D4AF37">
    <circle cx="380" cy="161" r="5"/><circle cx="414" cy="161" r="5"/><circle cx="448" cy="161" r="5"/>
    <circle cx="482" cy="161" r="5"/><circle cx="516" cy="161" r="5"/><circle cx="550" cy="161" r="5"/>
    <circle cx="584" cy="161" r="5"/><circle cx="618" cy="161" r="5"/><circle cx="652" cy="161" r="5"/>
    <circle cx="686" cy="161" r="5"/>
  </g>
  <!-- unused screen pins -->
  <g stroke="#9AA3B2" stroke-width="2" stroke-linecap="round">
    <path d="M442 182l12 12M454 182l-12 12"/><path d="M578 182l12 12M590 182l-12 12"/><path d="M680 182l12 12M692 182l-12 12"/>
  </g>
  <text x="742" y="98" fill="#55606F" font-size="12">MISO, RAM_CS, BL:</text>
  <text x="742" y="114" fill="#55606F" font-size="12">leave empty</text>

  <!-- ===================== ARDUINO UNO ===================== -->
  <rect x="330" y="300" width="500" height="300" rx="14" fill="#00878F"/>
  <rect x="306" y="330" width="56" height="62" rx="4" fill="#B8BEC6"/>
  <text x="334" y="366" fill="#55606F" font-size="10" text-anchor="middle">USB</text>
  <rect x="306" y="500" width="50" height="62" rx="4" fill="#26292E"/>
  <rect x="590" y="430" width="200" height="48" rx="4" fill="#1E2227"/>
  <text x="690" y="459" fill="#B8BEC6" font-size="11" text-anchor="middle">ATmega328P</text>
  <text x="372" y="460" fill="#FFFFFF" font-size="18" font-weight="800" font-family="Rubik, Segoe UI, sans-serif">ARDUINO UNO</text>
  <!-- top header -->
  <rect x="430" y="310" width="200" height="20" rx="3" fill="#1A1C20"/>
  <rect x="646" y="310" width="160" height="20" rx="3" fill="#1A1C20"/>
  <g fill="#6B7280">
    <circle cx="440" cy="320" r="4"/><circle cx="460" cy="320" r="4"/><circle cx="480" cy="320" r="4"/><circle cx="540" cy="320" r="4"/>
    <circle cx="656" cy="320" r="4"/><circle cx="676" cy="320" r="4"/><circle cx="696" cy="320" r="4"/><circle cx="716" cy="320" r="4"/>
    <circle cx="756" cy="320" r="4"/><circle cx="776" cy="320" r="4"/><circle cx="796" cy="320" r="4"/>
  </g>
  <g fill="#FFFFFF" font-size="11" text-anchor="end">
    <text transform="translate(444 340) rotate(-90)" fill="#BFE3E6">SCL</text>
    <text transform="translate(464 340) rotate(-90)" fill="#BFE3E6">SDA</text>
    <text transform="translate(484 340) rotate(-90)" fill="#BFE3E6">AREF</text>
    <text transform="translate(504 340) rotate(-90)" font-weight="700">GND</text>
    <text transform="translate(524 340) rotate(-90)" font-weight="700">13</text>
    <text transform="translate(544 340) rotate(-90)" fill="#BFE3E6">12</text>
    <text transform="translate(564 340) rotate(-90)" font-weight="700">~11</text>
    <text transform="translate(584 340) rotate(-90)" font-weight="700">~10</text>
    <text transform="translate(604 340) rotate(-90)" font-weight="700">~9</text>
    <text transform="translate(624 340) rotate(-90)" font-weight="700">8</text>
    <text transform="translate(660 340) rotate(-90)" fill="#BFE3E6">7</text>
    <text transform="translate(680 340) rotate(-90)" fill="#BFE3E6">~6</text>
    <text transform="translate(700 340) rotate(-90)" fill="#BFE3E6">~5</text>
    <text transform="translate(720 340) rotate(-90)" fill="#BFE3E6">4</text>
    <text transform="translate(740 340) rotate(-90)" font-weight="700">~3</text>
    <text transform="translate(760 340) rotate(-90)" fill="#BFE3E6">2</text>
    <text transform="translate(780 340) rotate(-90)" fill="#BFE3E6">TX 1</text>
    <text transform="translate(800 340) rotate(-90)" fill="#BFE3E6">RX 0</text>
  </g>
  <text x="646" y="400" fill="#BFE3E6" font-size="11">DIGITAL (PWM ~)</text>
  <!-- bottom header -->
  <rect x="460" y="570" width="140" height="20" rx="3" fill="#1A1C20"/>
  <rect x="640" y="570" width="120" height="20" rx="3" fill="#1A1C20"/>
  <g fill="#6B7280">
    <circle cx="470" cy="580" r="4"/><circle cx="490" cy="580" r="4"/><circle cx="550" cy="580" r="4"/><circle cx="590" cy="580" r="4"/>
    <circle cx="650" cy="580" r="4"/><circle cx="670" cy="580" r="4"/><circle cx="690" cy="580" r="4"/><circle cx="710" cy="580" r="4"/>
    <circle cx="730" cy="580" r="4"/><circle cx="750" cy="580" r="4"/>
  </g>
  <g fill="#FFFFFF" font-size="11">
